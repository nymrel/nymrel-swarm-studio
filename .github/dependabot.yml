version: 2

updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      tooling-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    rebase-strategy: auto
    groups:
      github-actions:
        patterns: ['*']
