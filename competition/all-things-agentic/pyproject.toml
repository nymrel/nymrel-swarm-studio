[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nymrel-relay-agent"
version = "0.1.0"
description = "Guarded long-running Google ADK agent fleet with durable evidence and human approvals"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nymrel", email = "contact@nymrel.com" }]
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-cloud-firestore>=2.28.0,<3.0.0",
  "google-cloud-pubsub>=2.39.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["relay_agent", "relay_core", "relay_google"]

[tool.hatch.build.targets.sdist]
include = [
  "/relay_agent",
  "/relay_core",
  "/relay_google",
  "/tests",
  "/README.md",
  "/agents-cli-manifest.yaml",
]
